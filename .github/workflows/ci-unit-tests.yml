name: Marlin Build (MKS TinyBee)

on:
  workflow_dispatch: # Bu satır manuel başlatma butonunu ekler

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Marlin
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Run Build for MKS TinyBee
      run: |
        # Configuration dosyalarının Marlin klasöründe olduğunu varsayar
        pio run -e mks_tinybee

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v3
      with:
        name: MKS_TinyBee_Firmware
        path: .pio/build/mks_tinybee/firmware.bin
