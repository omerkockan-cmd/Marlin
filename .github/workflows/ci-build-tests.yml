name: Marlin Build MKS TinyBee

on:
  workflow_dispatch: # Manuel başlatma butonu
  push:
    branches:
      - "*" # Tüm branşlarda çalışır

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 # v3'ten v4'e güncellendi

    - name: Set up Python
      uses: actions/setup-python@v5 # v4'ten v5'e güncellendi
      with:
        python-version: '3.9'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install -U platformio

    - name: Run Build for MKS TinyBee
      run: |
        # Önceki kalıntıları temizle ve derle
        pio run -e mks_tinybee --target clean
        pio run -e mks_tinybee

    - name: Upload Firmware
      if: success()
      uses: actions/upload-artifact@v4 # HATAYI ÇÖZEN GÜNCELLEME: v3 yerine v4
      with:
        name: MKS_TinyBee_Firmware
        path: .pio/build/mks_tinybee/firmware.bin
